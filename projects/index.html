<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Cybernerds KARE</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .projects-content {
            padding: 2rem;
            margin-top: 5rem;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title {
            color: #00ffff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .section-subtitle {
            color: #ffffff90;
            font-size: 1.2rem;
        }

        .wip-container {
            background: rgba(19, 21, 29, 0.8);
            border: 1px solid #00ffff40;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .icon-circle {
            aspect-ratio: 1;
            width: 8rem;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            border: 1px solid rgba(0, 255, 255, 0.3);
            animation: pulse 2s infinite;
        }

        .icon-circle i {
            color: #00ffff;
            font-size: 4rem;
        }

        .wip-title {
            color: #00ffff;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .wip-description {
            color: #ffffff90;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #00ffff;
            animation: progress 3s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.4);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(0, 255, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 255, 255, 0);
            }
        }

        @keyframes progress {
            0% {
                width: 0%;
                opacity: 1;
            }
            50% {
                width: 100%;
                opacity: 0.5;
            }
            100% {
                width: 0%;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <script src="../JAVASCRIPT/matrix.js"></script>

    <header class="header">
        <a href="#" class="logo">{Cybernerds KARE}</a>
        <nav class="navbar">
            <a href="/" style="--i: 1">Home</a>
            <a href="/projects" style="--i: 2">Projects</a>
            <a href="/game-hacking" style="--i: 3">Game Hacking</a>
        </nav>
    </header>

    <section class="projects-content">
        <div class="section-header">
            <h1 class="section-title">Our Projects</h1>
            <p class="section-subtitle">Exploring the frontiers of cybersecurity</p>
        </div>

        <div class="wip-container">
            <div class="icon-circle">
                <i class='bx bx-code-block'></i>
            </div>
            <h2 class="wip-title">Work in Progress</h2>
            <p class="wip-description">
                We're working on something amazing! Our team is crafting innovative cybersecurity projects 
                that will push the boundaries of what's possible. Stay tuned for the big reveal!
            </p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </section>
</body>
</html>
